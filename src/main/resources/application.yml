# yaml-language-server: $schema=https://www.schemastore.org/any.json
spring:
  application:
    admin: ruwei-ai-code-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code
    username: root
    password: 123456
  profiles:
    active: local
      # redis
  data:
    redis:
      host: 192.168.211.201
      port: 6379
      ttl: 3600
      database: 0

server:
  port: 8123
  servlet:
    context-path: /api






















# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.ruwei.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

